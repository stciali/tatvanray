name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Flutter Android Native Scaffolding & Configure Proguard
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.tatvan.ray
          rm -f test/widget_test.dart

          # Proguard keep rules for ML Kit to prevent missing class errors
          mkdir -p android/app
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google_mlkit_text_recognition.**
          -keep class com.google_mlkit_text_recognition.** { *; }
          -dontwarn **
          -keepattributes *Annotation*
          EOF

          # Run standalone patcher script
          python3 scripts/patch_gradle.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Dart & Flutter Tests
        run: flutter test test/app_logic_test.dart

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tatvan-Ray-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
