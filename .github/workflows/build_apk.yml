name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate Flutter Android Native Scaffolding & Configure Proguard
        run: |
          rm -rf android
          flutter create . --platforms=android --org=com.tatvan.ray
          rm -f test/widget_test.dart

          # Proguard keep rules for ML Kit to prevent missing class errors
          mkdir -p android/app
          cat << 'EOF' > android/app/proguard-rules.pro
          -keep class com.google.mlkit.** { *; }
          -dontwarn com.google.mlkit.**
          -dontwarn com.google_mlkit_text_recognition.**
          -keep class com.google_mlkit_text_recognition.** { *; }
          -dontwarn **
          -keepattributes *Annotation*
          EOF

          # Universal Python patcher supporting both Kotlin DSL (.kts) and Groovy DSL (.gradle)
          python3 - << 'PYEOF'
          import os, re

          # 1. Patch app-level build file
          app_kts = 'android/app/build.gradle.kts'
          app_groovy = 'android/app/build.gradle'

          if os.path.exists(app_kts):
              with open(app_kts, 'r') as f:
                  content = f.read()
              content = re.sub(r'compileSdk\s*=\s*flutter\.compileSdkVersion', 'compileSdk = 36', content)
              content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 21', content)
              content = re.sub(r'targetSdk\s*=\s*flutter\.targetSdkVersion', 'targetSdk = 34', content)
              release_patch = '''release {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'''
              if 'isMinifyEnabled' not in content:
                  content = re.sub(r'release\s*\{', release_patch, content, count=1)
              with open(app_kts, 'w') as f:
                  f.write(content)
              print("Successfully patched " + app_kts)

          if os.path.exists(app_groovy):
              with open(app_groovy, 'r') as f:
                  content = f.read()
              content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', content)
              content = re.sub(r'minSdkVersion\s+flutter\.minSdkVersion', 'minSdkVersion 21', content)
              content = re.sub(r'targetSdkVersion\s+flutter\.targetSdkVersion', 'targetSdkVersion 34', content)
              release_patch = '''release {
                      minifyEnabled false
                      shrinkResources false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro''''
              if 'minifyEnabled' not in content:
                  content = re.sub(r'release\s*\{', release_patch, content, count=1)
              with open(app_groovy, 'w') as f:
                  f.write(content)
              print("Successfully patched " + app_groovy)

          # 2. Patch root-level build file to enforce compileSdk 36 for subprojects
          root_kts = 'android/build.gradle.kts'
          root_groovy = 'android/build.gradle'

          if os.path.exists(root_kts):
              with open(root_kts, 'a') as f:
                  f.write('''
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      val android = project.extensions.findByName("android")
                      if (android != null) {
                          try {
                              val method = android::class.java.getMethod("compileSdkVersion", Int::class.javaPrimitiveType)
                              method.invoke(android, 36)
                          } catch (e: Exception) {
                          }
                      }
                  }
              }
          }
          ''')
              print("Successfully patched " + root_kts)

          if os.path.exists(root_groovy):
              with open(root_groovy, 'a') as f:
                  f.write('''
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          ''')
              print("Successfully patched " + root_groovy)
          PYEOF

      - name: Get Dependencies
        run: flutter pub get

      - name: Run Dart & Flutter Tests
        run: flutter test test/app_logic_test.dart

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tatvan-Ray-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
